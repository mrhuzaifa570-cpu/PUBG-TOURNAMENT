<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PUBG Livik Solo Showdown</title>
    <style>
        :root {
            --primary: #f2a900;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 8px;
            border: 2px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-light);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--primary);
            border-radius: 5px;
            background-color: #0a0a0a;
            color: var(--text-light);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ffd13b;
            box-shadow: 0 0 5px rgba(242, 169, 0, 0.5);
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: #000;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #ffd13b;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
        }

        .price {
            text-align: center;
            background-color: #0a0a0a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Tournament Registration</h1>
        
        <div class="price">Entry Fee: $5</div>

        <form action="https://formspree.io/f/xvzlbgbv" method="POST">

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="pubgid">PUBG Account ID *</label>
                <input type="text" id="pubgid" name="pubgid" placeholder="Your PUBG username" required>
            </div>

            <div class="form-group">
                <label for="country">Country *</label>
                <select id="country" name="country" required>
                    <option value="">-- Select Country --</option>
                    <option value="US">United States</option>
                    <option value="CA">Canada</option>
                    <option value="UK">United Kingdom</option>
                    <option value="IN">India</option>
                    <option value="AU">Australia</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="experience">Skill Level *</label>
                <select id="experience" name="experience" required>
                    <option value="">-- Select Skill Level --</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                    <option value="pro">Pro</option>
                </select>
            </div>

            <button type="submit" class="btn">Pay $5 & Confirm Registration</button>
        </from\>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

</body>
</html>
